[project]
name = "audio-extract"
version = "0.2.0"
description = "UVR-style stem separation + spectrogram ensemble, driven from a uv environment"
requires-python = ">=3.10,<3.13"
dependencies = [
    "audio-separator[cpu]",   # Apple Silicon: CPU/CoreML onnxruntime (not the CUDA [gpu] extra)
    "numpy",
    "soundfile",
    "librosa",
    "matplotlib>=3.10.9",
    "pyyaml",
    "imageio-ffmpeg",   # bundled ffmpeg binary so AAC delivery never needs a system ffmpeg                 # v2 panel.yaml loader
]

[project.optional-dependencies]
train = ["demucs", "omegaconf"]   # HTDemucs student training (research6 GPU)
dev = ["pytest"]

[project.scripts]
audio-extract = "audio_extract.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the v2 package is installed as an importable module + console script.
# v1 (convert.py, web/, uvr_ensemble.py) stays a loose script, unchanged.
packages = ["audio_extract"]

[tool.uv]
# keep resolution reproducible; uv writes uv.lock

[tool.pytest.ini_options]
norecursedirs = ["project", "calibration", ".venv"]
