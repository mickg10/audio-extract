schema: audio-extract/train/classical-student-v1
experiment: PRETRAINED-HTDEMUCS-OPERA-EXACT-CV-100
fold: V
base_arch: HTDemucs
base_checkpoint:
  signature: 04573f0d
  role: released vocals-specialized single model
  sha256: f3cf25b222c4eed7cd49dd8b2c9597d50c18bd154090f7b919cfa5f93cf22c49
sources: [drums, bass, other, vocals]
vocal_source_index: 3
audio_channels: 2
samplerate: 44100
data:
  manifest: datasets/classical-v1.jsonl
  splits: datasets/classical-v1-splits.json
  materialized_root: /home/mickg/train_data_exact_cv_v1
  train_work_ids: [bologna_puccini, bologna_donizetti]
  eval_work_ids: [bologna_verdi, aalto_mozart_dry]
  integrity_required: linear_exact
  task: featured_soloist_vs_rest
optim:
  name: adam
  steps_first_run: 100
  batch: 1
  crop_s: 7.8
  gradient_clip: 5.0
  schedule:
    - steps: [0, 500]
      upper_decoder_lr: 0.0001
      transformer_decoder_lr: 0.00003
      lower_encoder_lr: 0
    - steps: [500, 2000]
      full_network_lr: 0.00002
      decay: cosine
  evaluation_steps: [0, 100]
loss:
  complex_stft: 0.5
  waveform_l1: 1.0
  mixture_consistency: 0.0
  no_vocal_false_positive: 0.25
  vocal_only_false_negative: 0.25
  source_coordinate_alpha_beta_R: 0.1
  stereo_coherence: 0.05
  exact_event_weighting: 0.25
  implementation: audio_extract.classical_loss:classical_separation_loss
export:
  to: demucs.states .th -> demucs.apply_model -> audio_separator.demucs_separator
  zero_step_parity_shifts: 0
note: Exact-only engineering falsification fold; not a final generalization claim.
