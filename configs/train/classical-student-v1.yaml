# audio-extract train classical — §2 first CONTINUATION run (NOT from-scratch).
# Base = RELEASED vocal-specialized HTDemucs 04573f0d, loaded via demucs (arch NOT reconstructed),
# FULL fine-tune (§13: full FT is the first pilot, not LoRA/zero-init). Product (§2):
# V_hat = outputs["vocals"];  A_hat = mixture - V_hat  (other 3 stems ignored).
schema: classical-student-continuation/v1
base_arch: HTDemucs
base_sig: 04573f0d              # vocal-specialized HTDemucs-ft; 2nd baseline 955717e8
finetune: full
product:
  V_hat: outputs["vocals"]
  A_hat: mixture - V_hat
curriculum_phase: A            # §7 Phase A: preserve broad boundary; Cantolopera/broad-replay deferred to B/C
sampler:                       # §7 hierarchical Gate-2 Phase-A proportions
  exact_opera_MAV: 0.60        # orchestra-weighted (donor + freidi + cantoria)
  no_vocal_hard_negative: 0.25 # M=A, V=0  (teach: orchestra is not solo voice)
  vocal_only_control: 0.15     # M=V, A=0
optim:
  lr: 0.0003
  batch: 2
  crop_s: 6
  steps_first_run: 2000
loss:                          # §10 exact family + §11 source-coordinate penalties + controls + §13.2 anti-forgetting
  vc: 1.0                      # complex-MRSTFT(V_hat, V)
  ac: 1.0                      # complex-MRSTFT(A_hat, A)
  aw: 1.0                      # event-weighted |A_hat - A|_1
  alpha: 0.2                   # §11 |alpha-1|^2  (orchestral transfer gain)
  beta: 0.5                    # §11 |beta|^2     (retained solo voice)
  beta_aud: 0.2                # §11 ||beta V||^2 / ||alpha A||^2 (audibility)
  R: 0.3                       # §11 ||R||^2 / ||A||^2 (unexplained artifact)
  stereo: 0.2                  # side-channel consistency
  no_vocal: 2.0                # §10 no-vocal control D(V_hat, 0), high weight
  parent_reg: 30.0             # §13.2 parent-weight anchor (mean squared deviation from 04573f0d)
gate:                          # §2 champion/challenger
  steps: [0, 100, 500, 2000]
  held_out: [bologna_verdi, bologna_puccini, bologna_donizetti, aalto_mozart_dry, aalto_mozart_hall]
  baselines: [untouched_04573f0d, untouched_955717e8, mdx23c_residual, median_ensemble]
  parity: step0 == untouched_04573f0d
