schema: audio-extract/train/classical-student-v1
base_arch: HTDemucs
base_checkpoint: htdemucs
base_arch_fact: pretrained four-source HTDemucs; supervise vocals directly and
  accompaniment as drums+bass+other. A random two-source initialization is smoke-only,
  not a fine-tuning base.
sources:
- accompaniment
- vocals
audio_channels: 2
samplerate: 44100
model:
  channels: 48
  depth: 4
  segment_s: 7.8
data:
  manifest: datasets/classical-v1.jsonl
  splits: datasets/classical-v1-splits.json
  train_splits:
  - train
  val_splits:
  - val
  holdout: test-v1 (CONTAMINATED - not for acceptance)
optim:
  name: adam
  lr: 0.0003
  steps: 200000
  batch: 4
  crop_s: 7.8
loss:
  complex_stft: 0.5
  waveform_l1: 1.0
  mixture_consistency: 0.1
  no_vocal_false_positive: 0.25
  vocal_only_false_negative: 0.25
  source_coordinate_alpha_beta_R: 0.1
  stereo_coherence: 0.05
  exact_event_weighting: 0.25
  implementation: audio_extract.classical_loss:classical_separation_loss
export:
  to: audio_separator demucs_separator (production inference adapter)
note: 'Do NOT optimize the SHADOW judge (gpt56 H4). SMOKE (100 steps/2 works/eval
  3rd) PASSED: see calibration/train_classical_smoke_report.json'
