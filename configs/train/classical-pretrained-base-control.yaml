schema: audio-extract/train/classical-student-v1
base_arch: HTDemucs
base_checkpoint:
  signature: 955717e8
  role: released base single model (untouched step-0 control)
  sha256: 8726e21a993978c7ba086d3872e7608d7d5bfca646ca4aca459ffda844faa8b4
base_arch_fact: >-
  Preserve the pretrained four-source topology. This config is an untouched
  inference/export control and is not a continuation-training proposal.
sources: [drums, bass, other, vocals]
vocal_source_index: 3
audio_channels: 2
samplerate: 44100
data:
  manifest: datasets/classical-v1.jsonl
  splits: datasets/classical-v1-splits.json
  materialized_root: /home/mickg/train_data_f32_v1
  train_splits: [train]
  holdout: test-v1 (Bologna/Aalto — CONTAMINATED legacy; excluded from training)
optim:
  name: adam
  steps_first_run: 0
  batch: 1
  crop_s: 7.8
  gradient_clip: 5.0
