name: PR25 grouped D0-R0 artifact validation

on:
  push:
    branches:
      - bigoracle/d0-r0-grouped-comparison-artifacts-20260810
  pull_request:
    branches:
      - bigoracle/counterfactual-risk-router-v0-20260809
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr25-grouped-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: CPU exact-head validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install uv
        run: |
          python -m pip install --upgrade pip uv

      - name: Record tool versions
        run: |
          mkdir -p validation-logs
          {
            echo "head=${GITHUB_SHA}"
            echo "checked_out_head=$(git rev-parse HEAD)"
            python --version
            uv --version
            git --version
          } | tee validation-logs/versions.log

      - name: Resolve project environment
        run: |
          set -o pipefail
          uv sync --extra dev 2>&1 | tee validation-logs/uv-sync.log
          uv pip freeze | sort > validation-logs/environment.txt

      - name: Focused v4 Python and report-derived lineage contracts
        run: |
          set -o pipefail
          uv run --extra dev pytest -q \
            tests/test_counterfactual_risk_grouped_report_artifact_v4.py \
            tests/test_counterfactual_risk_inference_partition_v3.py \
            tests/test_counterfactual_risk_source_lineage_v3.py \
            2>&1 | tee validation-logs/focused-v4.log

      - name: Paired v4 JSON Schema and rejected mutations
        run: |
          set -o pipefail
          uv run --with "jsonschema>=4.23" --extra dev pytest -q \
            tests/test_d0_r0_grouped_comparison_schema_v4.py \
            2>&1 | tee validation-logs/schema-v4.log

      - name: Complete repository pytest
        run: |
          set -o pipefail
          uv run --extra dev pytest -q \
            2>&1 | tee validation-logs/full-pytest.log

      - name: PR touched-file Ruff (zero findings, pinned)
        run: |
          set -o pipefail
          mkdir -p validation-logs
          BASE_SHA=2254c8e1bb797c3cedaa765d00950e0e3d496aa2
          RUFF_VERSION=0.16.2
          # Fail closed if the frozen Ruff base commit is missing from history.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "FATAL: frozen Ruff base ${BASE_SHA} is absent from history" \
              | tee validation-logs/ruff-touched.log
            exit 1
          fi
          MERGE_BASE="$(git merge-base "${BASE_SHA}" HEAD)"
          if [ -z "${MERGE_BASE}" ]; then
            echo "FATAL: cannot compute merge-base for the PR diff" \
              | tee validation-logs/ruff-touched.log
            exit 1
          fi
          # Deterministically enumerate every PR-added/modified Python file that
          # still exists, then require ZERO findings on that exact set.
          git diff --name-only "${MERGE_BASE}..HEAD" -- '*.py' \
            > validation-logs/touched-all.txt
          : > validation-logs/touched-files.txt
          while IFS= read -r path; do
            if [ -n "${path}" ] && [ -f "${path}" ]; then
              printf '%s\n' "${path}" >> validation-logs/touched-files.txt
            fi
          done < validation-logs/touched-all.txt
          TOUCHED_COUNT="$(grep -c . validation-logs/touched-files.txt || true)"
          {
            echo "base_sha=${BASE_SHA}"
            echo "merge_base=${MERGE_BASE}"
            echo "ruff_version=${RUFF_VERSION}"
            echo "touched_file_count=${TOUCHED_COUNT}"
          } | tee validation-logs/ruff-touched-meta.log
          # Fail closed if the diff could not be enumerated.
          if [ "${TOUCHED_COUNT}" -eq 0 ]; then
            echo "FATAL: no PR-touched Python files could be enumerated" \
              | tee -a validation-logs/ruff-touched.log
            exit 1
          fi
          mapfile -t TOUCHED < validation-logs/touched-files.txt
          uvx "ruff@${RUFF_VERSION}" check --no-cache --output-format concise \
            "${TOUCHED[@]}" 2>&1 | tee -a validation-logs/ruff-touched.log

      - name: Repository-wide Ruff ratchet (head <= frozen base 510)
        run: |
          set -o pipefail
          mkdir -p validation-logs
          BASE_SHA=2254c8e1bb797c3cedaa765d00950e0e3d496aa2
          RUFF_VERSION=0.16.2
          RECORDED_BASE_COUNT=510
          # Fail closed on a malformed recorded baseline.
          case "${RECORDED_BASE_COUNT}" in
            ''|*[!0-9]*)
              echo "FATAL: recorded base count is malformed" \
                | tee validation-logs/ruff-ratchet.log
              exit 1 ;;
          esac
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "FATAL: frozen Ruff base ${BASE_SHA} is absent from history" \
              | tee validation-logs/ruff-ratchet.log
            exit 1
          fi
          # Re-derive the base count with the pinned Ruff in a throwaway
          # worktree so the frozen baseline is tamper-evident; fail closed on
          # any drift from the recorded count.
          BASE_TREE="${RUNNER_TEMP:-/tmp}/ruff-base-${BASE_SHA}"
          rm -rf "${BASE_TREE}"
          git worktree add --detach "${BASE_TREE}" "${BASE_SHA}" >/dev/null
          ( cd "${BASE_TREE}" \
              && uvx "ruff@${RUFF_VERSION}" check --no-cache \
                   --output-format json . ) \
            > validation-logs/ruff-base.json || true
          DERIVED_BASE_COUNT="$(python -c 'import json;print(len(json.load(open("validation-logs/ruff-base.json"))))')"
          git worktree remove --force "${BASE_TREE}" >/dev/null 2>&1 || true
          case "${DERIVED_BASE_COUNT}" in
            ''|*[!0-9]*)
              echo "FATAL: derived base count is malformed" \
                | tee validation-logs/ruff-ratchet.log
              exit 1 ;;
          esac
          if [ "${DERIVED_BASE_COUNT}" -ne "${RECORDED_BASE_COUNT}" ]; then
            echo "FATAL: base Ruff count drifted: derived ${DERIVED_BASE_COUNT} != recorded ${RECORDED_BASE_COUNT}" \
              | tee validation-logs/ruff-ratchet.log
            exit 1
          fi
          # Deterministic head count with the same pinned Ruff.
          uvx "ruff@${RUFF_VERSION}" check --no-cache --output-format json . \
            > validation-logs/ruff-head.json || true
          HEAD_COUNT="$(python -c 'import json;print(len(json.load(open("validation-logs/ruff-head.json"))))')"
          case "${HEAD_COUNT}" in
            ''|*[!0-9]*)
              echo "FATAL: head count is malformed" \
                | tee validation-logs/ruff-ratchet.log
              exit 1 ;;
          esac
          uvx "ruff@${RUFF_VERSION}" check --no-cache --output-format concise . \
            > validation-logs/ruff-head.txt 2>&1 || true
          {
            echo "base_sha=${BASE_SHA}"
            echo "ruff_version=${RUFF_VERSION}"
            echo "recorded_base_count=${RECORDED_BASE_COUNT}"
            echo "derived_base_count=${DERIVED_BASE_COUNT}"
            echo "head_count=${HEAD_COUNT}"
          } | tee validation-logs/ruff-ratchet.log
          if [ "${HEAD_COUNT}" -gt "${RECORDED_BASE_COUNT}" ]; then
            echo "FATAL: repository-wide Ruff regressed: head ${HEAD_COUNT} > base ${RECORDED_BASE_COUNT}" \
              | tee -a validation-logs/ruff-ratchet.log
            exit 1
          fi
          echo "OK: head ${HEAD_COUNT} <= base ${RECORDED_BASE_COUNT}" \
            | tee -a validation-logs/ruff-ratchet.log

      - name: Compile and structural checks
        run: |
          set -o pipefail
          python -m compileall -q audio_extract tests \
            2>&1 | tee validation-logs/compileall.log
          python -m json.tool \
            schemas/d0-r0-grouped-comparison-report-v3.schema.json \
            > validation-logs/schema-v3.normalized.json
          python -m json.tool \
            schemas/d0-r0-grouped-comparison-report-v4.schema.json \
            > validation-logs/schema-v4.normalized.json
          git diff --check 2>&1 | tee validation-logs/git-diff-check.log

      - name: Upload exact-head validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr25-grouped-artifact-validation-${{ github.sha }}
          path: validation-logs/
          if-no-files-found: error
          retention-days: 14
